<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像レイアウト印刷</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.app{padding:22px;min-height:100vh}.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}button,select,input{font:inherit}button{min-height:44px;border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:650}.primary,.file-label{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#dc2626}input[type=file]{display:none}.file-label{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.stage-wrap{overflow:auto;background:#e5e7eb;border-radius:14px;padding:22px;min-height:500px}.paper{position:relative;margin:auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;touch-action:none}.paper.a4p{width:794px;height:1123px}.paper.a4l{width:1123px;height:794px}.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9ca3af;font-size:18px;padding:30px;pointer-events:none}.item{position:absolute;left:40px;top:40px;transform-origin:center;cursor:grab;user-select:none;touch-action:none;border:2px solid transparent}.item.selected{border-color:#2563eb;outline:2px solid rgba(37,99,235,.22)}.item img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.handle{position:absolute;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;right:-10px;bottom:-10px;cursor:nwse-resize;display:none}.item.selected .handle{display:block}.side{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;position:sticky;top:12px}.side h2{font-size:16px;margin:0 0 14px}.group{border-top:1px solid #e5e7eb;padding-top:14px;margin-top:14px}.group:first-of-type{border-top:0;padding-top:0;margin-top:0}label.field{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}select,input[type=number],input[type=range]{width:100%;min-height:42px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;padding:7px 9px}.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{margin-top:12px}.hint{font-size:12px;line-height:1.6;color:#6b7280;margin-top:12px}.status{font-size:13px;color:#4b5563;margin-left:auto}.app-note{width:100%;font-size:13px;line-height:1.6;color:#4b5563}@media(max-width:820px){.app{padding:12px}.workspace{grid-template-columns:1fr}.side{position:static}.stage-wrap{padding:12px}}@media print{body{background:#fff}.topbar,.side,.placeholder,.handle{display:none!important}.app,.workspace,.stage-wrap{padding:0!important;margin:0!important;background:#fff!important;display:block!important}.paper{box-shadow:none!important;margin:0!important}.item{border:0!important;outline:0!important}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="topbar">
<label class="file-label">＋ 画像を追加<input id="fileInput" type="file" accept="image/*" multiple></label>
<button id="fitAll">画像を自動整列</button>
<button id="clearAll">すべて削除</button>
<button class="primary" id="printBtn">印刷する</button>
<span class="status" id="status">画像を追加してください</span>
<div class="app-note">複数画像を自由に配置し、サイズ変更・回転・複製・印刷ができます。</div>
</div>
<div class="workspace">
<div class="stage-wrap"><div class="paper a4p" id="paper"><div class="placeholder" id="placeholder">ここに画像を配置します<br>「画像を追加」から複数枚まとめて選択できます</div></div></div>
<aside class="side"><h2>レイアウト設定</h2>
<div class="group"><label class="field" for="orientation">用紙</label><select id="orientation"><option value="portrait">A4 縦</option><option value="landscape">A4 横</option></select></div>
<div class="group"><strong>選択中の画像</strong><div class="row"><div><label class="field" for="widthMm">横幅 mm</label><input id="widthMm" type="number" min="10" max="297" value="80"></div><div><label class="field" for="heightMm">高さ mm</label><input id="heightMm" type="number" min="10" max="297" value="80"></div></div><label class="field" for="rotation">回転</label><input id="rotation" type="range" min="-180" max="180" value="0"><div id="rotationLabel" class="hint">0°</div><div class="actions"><button id="rotLeft">↺ 90°</button><button id="rotRight">↻ 90°</button><button id="duplicate">複製</button><button class="danger" id="deleteSelected">削除</button></div><div class="actions"><button id="bringFront">前面へ</button><button id="sendBack">背面へ</button></div></div>
<p class="hint">画像はドラッグで移動できます。右下の青い丸で拡大・縮小できます。</p></aside>
</div></div>
<script>
(()=>{const root=document.getElementById('app'),paper=document.getElementById('paper'),input=document.getElementById('fileInput'),placeholder=document.getElementById('placeholder'),status=document.getElementById('status'),widthMm=document.getElementById('widthMm'),heightMm=document.getElementById('heightMm'),rotation=document.getElementById('rotation'),rotationLabel=document.getElementById('rotationLabel');let selected=null,zCounter=2;const MM=3.7795275591;const items=()=>[...paper.querySelectorAll('.item')];function update(){placeholder.style.display=items().length?'none':'grid';status.textContent=items().length?items().length+'枚の画像':'画像を追加してください'}function select(el){items().forEach(x=>x.classList.remove('selected'));selected=el;if(el){el.classList.add('selected');sync()}}function sync(){if(!selected)return;widthMm.value=Math.round(parseFloat(selected.style.width)/MM);heightMm.value=Math.round(parseFloat(selected.style.height)/MM);rotation.value=selected.dataset.rot||0;rotationLabel.textContent=(selected.dataset.rot||0)+'°'}function setRot(v){if(!selected)return;let n=Math.max(-180,Math.min(180,Number(v)||0));selected.dataset.rot=n;selected.style.transform='rotate('+n+'deg)';rotation.value=n;rotationLabel.textContent=n+'°'}function bind(el,h){el.addEventListener('pointerdown',e=>{if(e.target===h)return;select(el);const sx=e.clientX,sy=e.clientY,sl=parseFloat(el.style.left)||0,st=parseFloat(el.style.top)||0;el.setPointerCapture(e.pointerId);const move=ev=>{el.style.left=Math.max(0,Math.min(paper.clientWidth-el.offsetWidth,sl+ev.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(paper.clientHeight-el.offsetHeight,st+ev.clientY-sy))+'px'};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)});h.addEventListener('pointerdown',e=>{e.stopPropagation();select(el);const sx=e.clientX,sw=el.offsetWidth,sh=el.offsetHeight,ratio=sw/sh;h.setPointerCapture(e.pointerId);const move=ev=>{let nw=Math.max(40,sw+ev.clientX-sx);el.style.width=nw+'px';el.style.height=nw/ratio+'px';sync()};const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up)})}function addImage(src,index){const el=document.createElement('div');el.className='item';el.style.width='300px';el.style.height='220px';el.style.left=35+index*24+'px';el.style.top=35+index*24+'px';el.style.zIndex=zCounter++;el.dataset.rot='0';const img=document.createElement('img');img.src=src;img.onload=()=>{const r=img.naturalWidth/img.naturalHeight;if(r>1)el.style.height=300/r+'px';else{el.style.height='300px';el.style.width=300*r+'px'}sync()};const h=document.createElement('span');h.className='handle';el.append(img,h);paper.append(el);bind(el,h);select(el);update()}input.addEventListener('change',()=>{[...input.files].forEach((f,i)=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>addImage(e.target.result,i);r.readAsDataURL(f)});input.value='' });widthMm.addEventListener('change',()=>{if(selected)selected.style.width=Math.max(10,Number(widthMm.value)||10)*MM+'px'});heightMm.addEventListener('change',()=>{if(selected)selected.style.height=Math.max(10,Number(heightMm.value)||10)*MM+'px'});rotation.addEventListener('input',()=>setRot(rotation.value));document.getElementById('rotLeft').onclick=()=>setRot((Number(selected?.dataset.rot)||0)-90);document.getElementById('rotRight').onclick=()=>setRot((Number(selected?.dataset.rot)||0)+90);document.getElementById('deleteSelected').onclick=()=>{if(selected){selected.remove();selected=null;update()}};document.getElementById('duplicate').onclick=()=>{if(!selected)return;const c=selected.cloneNode(true);c.classList.remove('selected');c.style.left=parseFloat(selected.style.left)+20+'px';c.style.top=parseFloat(selected.style.top)+20+'px';c.style.zIndex=zCounter++;paper.append(c);bind(c,c.querySelector('.handle'));select(c);update()};document.getElementById('bringFront').onclick=()=>{if(selected)selected.style.zIndex=zCounter++};document.getElementById('sendBack').onclick=()=>{if(selected)selected.style.zIndex=1};document.getElementById('clearAll').onclick=()=>{items().forEach(x=>x.remove());selected=null;update()};document.getElementById('orientation').onchange=e=>{paper.classList.toggle('a4p',e.target.value==='portrait');paper.classList.toggle('a4l',e.target.value==='landscape')};document.getElementById('fitAll').onclick=()=>{const a=items();if(!a.length)return;const cols=Math.ceil(Math.sqrt(a.length)),rows=Math.ceil(a.length/cols),gap=24,cw=(paper.clientWidth-gap*(cols+1))/cols,ch=(paper.clientHeight-gap*(rows+1))/rows;a.forEach((el,i)=>{const img=el.querySelector('img'),r=(img.naturalWidth||1)/(img.naturalHeight||1);let w=cw,h=w/r;if(h>ch){h=ch;w=h*r}el.style.width=Math.max(40,w)+'px';el.style.height=Math.max(40,h)+'px';el.style.left=gap+(i%cols)*(cw+gap)+(cw-w)/2+'px';el.style.top=gap+Math.floor(i/cols)*(ch+gap)+(ch-h)/2+'px';setRot.call(null,0)});select(a[0])};document.getElementById('printBtn').onclick=()=>{if(!items().length){status.textContent='先に画像を追加してください';return}items().forEach(x=>x.classList.remove('selected'));selected=null;window.print()};update()})();
</script>
</body>
</html>
